# Documentation site for the MLOps self-study course.
# Build and preview instructions live in docs/reference-guides/, not in this file's comments.

site_name: MLOps
site_description: >-
  A self-study course in Machine Learning Operations, from a first reproducible
  project to an operated production system. Written for university students
  working alone on Windows 11, Linux, or macOS.
site_author: Engr. Dr. Muhammad Nadeem Majeed
site_url: https://nadeem-majeedch.github.io/MLOps/

repo_url: https://github.com/nadeem-majeedch/MLOps
repo_name: nadeem-majeedch/MLOps
edit_uri: edit/main/docs/

copyright: >-
  Course content by Engr. Dr. Muhammad Nadeem Majeed, Department of Data Science
  (PUCIT), University of the Punjab, Lahore. Licence not yet declared; see the
  About page.

docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  # No web fonts: keeps the site self-contained, fast, and readable offline.
  font: false

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - content.action.view

  icon:
    repo: fontawesome/brands/github

extra:
  generator: false

plugins:
  - search

# Treat content defects as warnings, so `mkdocs build --strict` fails on them.
# MkDocs defaults several of these to `info`, which would let a broken anchor or
# a page missing from the menu publish silently.
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    absolute_links: warn
    unrecognized_links: warn
    anchors: warn

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  # Icons are rendered from SVG bundled with Material; no network requests.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: false
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true

# Authoring material stays in the repository but is not part of the student site.
exclude_docs: |
  templates/
  audit-phase-0.md


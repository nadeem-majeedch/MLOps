name: release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Validate release bundle
        run: python validate_release.py --bundle release/tempting

      - name: Publish bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: release/tempting

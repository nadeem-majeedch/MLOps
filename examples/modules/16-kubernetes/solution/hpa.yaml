apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: raviride-eta
  namespace: raviride
  labels:
    app.kubernetes.io/name: raviride-eta
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: raviride-eta
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

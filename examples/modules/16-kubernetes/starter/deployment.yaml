apiVersion: apps/v1
kind: Deployment
metadata:
  name: raviride-eta
  namespace: default
  labels:
    app.kubernetes.io/name: raviride-eta
    app.kubernetes.io/component: api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: raviride-eta
  template:
    metadata:
      labels:
        app: raviride-eta
    spec:
      containers:
        - name: api
          image: raviride-eta:latest
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: API_KEY
              value: "demo-key-not-for-production"
            - name: LOG_LEVEL
              value: "DEBUG"
